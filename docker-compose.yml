services:
  mysql:
    image: mysql:8.0
    container_name: werewolf-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: werewolf123
      MYSQL_DATABASE: werewolf
      MYSQL_CHARSET: utf8mb4
      MYSQL_COLLATION: utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pwerewolf123"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: werewolf-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: werewolf-backend
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: werewolf123
      DB_NAME: werewolf
      JWT_SECRET: 509127582efb5331eca8bc722ae4c7ed9ecffb06f9a576f0740b7bd5418d185af49934aaec96290a44a3c0e54683262521c6d0b089051c4a7a8e7f1c57
      JWT_EXPIRES_IN: 7d
      PORT: 3001
      CORS_ORIGINS: http://121.196.239.144
      REDIS_URL: redis://redis:6379/0
      XIAOMI_API_KEY: ""
      XIAOMI_API_URL: https://api.xiaomimimo.com
      XIAOMI_MODEL_NAME: mimo-v2-flash
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: werewolf-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mysql_data:
  redis_data:
