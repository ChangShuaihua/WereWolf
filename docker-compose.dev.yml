services:
  mysql:
    image: mysql:8.0
    container_name: werewolf-mysql-dev
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: werewolf123
      MYSQL_DATABASE: werewolf
      MYSQL_CHARSET: utf8mb4
      MYSQL_COLLATION: utf8mb4_unicode_ci
    ports:
      - "3307:3306"
    volumes:
      - mysql_data_dev:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-pwerewolf123",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: werewolf-redis-dev
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data_dev:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: werewolf-backend-dev
    restart: unless-stopped
    environment:
      NODE_ENV: development
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: werewolf123
      DB_NAME: werewolf
      JWT_SECRET: your_jwt_secret_change_this_in_production
      JWT_EXPIRES_IN: 7d
      PORT: 3001
      CORS_ORIGINS: http://localhost,http://localhost:5173
      REDIS_URL: redis://redis:6379/0
      # AI API 配置（小米 MiMo）
      XIAOMI_API_KEY: ${XIAOMI_API_KEY:-}
      XIAOMI_API_URL: ${XIAOMI_API_URL:-https://api.xiaomimimo.com}
      XIAOMI_MODEL_NAME: ${XIAOMI_MODEL_NAME:-mimo-v2-flash}
    ports:
      - "3001:3001"
    volumes:
      - ./backend/src:/app/src
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: werewolf-frontend-dev
    restart: unless-stopped
    environment:
      NODE_ENV: development
      VITE_API_URL: http://backend:3001
    ports:
      - "5173:5173"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/index.html:/app/index.html
    depends_on:
      - backend

volumes:
  mysql_data_dev:
  redis_data_dev:
